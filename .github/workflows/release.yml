name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: FoxNote

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FoxNote ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          projectPath: FoxNote
          args: ${{ matrix.args }}

  android:
    name: Android
    runs-on: ubuntu-22.04
    needs: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Resolve Android NDK ranlib path
        shell: bash
        run: |
          set -euo pipefail

          NDK_CANDIDATE="${ANDROID_NDK_LATEST_HOME:-}"

          if [ -z "$NDK_CANDIDATE" ] && [ -n "${ANDROID_NDK_HOME:-}" ]; then
            NDK_CANDIDATE="$ANDROID_NDK_HOME"
          fi

          if [ -z "$NDK_CANDIDATE" ] && [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            NDK_CANDIDATE="$ANDROID_NDK_ROOT"
          fi

          if [ -z "$NDK_CANDIDATE" ]; then
            SDK_ROOT_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -n "$SDK_ROOT_PATH" ] && [ -d "$SDK_ROOT_PATH/ndk" ]; then
              NDK_CANDIDATE="$(ls -d "$SDK_ROOT_PATH/ndk"/* 2>/dev/null | sort -V | tail -n 1)"
            fi
          fi

          if [ -z "$NDK_CANDIDATE" ]; then
            echo "Failed to locate Android NDK path" >&2
            exit 1
          fi

          LLVM_RANLIB_PATH="$NDK_CANDIDATE/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"

          if [ ! -x "$LLVM_RANLIB_PATH" ]; then
            echo "Resolved llvm-ranlib is not executable: $LLVM_RANLIB_PATH" >&2
            exit 1
          fi

          echo "ANDROID_NDK_RESOLVED=$NDK_CANDIDATE" >> "$GITHUB_ENV"
          echo "LLVM_RANLIB=$LLVM_RANLIB_PATH" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: FoxNote

      - name: Build Android release artifacts
        run: pnpm tauri android build --apk --aab
        working-directory: FoxNote
        env:
          TARGET_RANLIB: ${{ env.LLVM_RANLIB }}
          RANLIB_aarch64_linux_android: ${{ env.LLVM_RANLIB }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB: ${{ env.LLVM_RANLIB }}

      - name: Upload Android assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            FoxNote/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            FoxNote/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
